<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quire</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23f5f5f7'/><rect x='3' y='4' width='10' height='8' fill='%23ffffff' stroke='%231d1d1f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;560&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Quire</h1>
  <p class="desc">INT64 and STRING rows in one file. A run is one transaction.</p>
  <p class="meta" id="db-path">loading…</p>
  <div id="schema" class="schema"><p class="label">No tables yet.</p></div>
  <div class="bar">
    <div id="snippets" class="snippets"></div>
    <button type="button" class="text" id="clear-btn">Clear</button>
    <button type="button" class="run" id="run-btn">Run</button>
  </div>
  <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="SELECT name, age FROM users WHERE age BETWEEN 30 AND 60 ORDER BY age DESC;"></textarea>
  <p class="meta" id="history"></p>
  <p class="meta" id="pages">pages</p>
  <div id="results"></div>
  <div id="keys"></div>
</main>
<script src="app.js"></script>
</body>
</html>
